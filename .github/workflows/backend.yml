name: Backend CI and staging deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: multiplayer_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d multiplayer_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/multiplayer_ci
          SPRING_DATASOURCE_USERNAME: ci_user
          SPRING_DATASOURCE_PASSWORD: ci_password
          GOOGLE_WEB_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
          APP_SESSION_SIGNING_KEY: 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
        run: bash ./gradlew --no-daemon build

      - name: Deploy to Heroku staging
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_EMAIL: ${{ vars.HEROKU_EMAIL }}
          HEROKU_APP_NAME: ${{ vars.HEROKU_APP_NAME }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          : "${HEROKU_API_KEY:?Missing HEROKU_API_KEY}"
          : "${HEROKU_EMAIL:?Missing HEROKU_EMAIL}"
          : "${HEROKU_APP_NAME:?Missing HEROKU_APP_NAME}"

          umask 077
          trap 'rm -f "$HOME/.netrc"' EXIT
          printf 'machine git.heroku.com\nlogin %s\npassword %s\n' \
            "$HEROKU_EMAIL" "$HEROKU_API_KEY" > "$HOME/.netrc"

          git push "https://git.heroku.com/${HEROKU_APP_NAME}.git" HEAD:main
